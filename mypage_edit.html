<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ編集 - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <a href="./mypage.html" class="btn-back"><span class="material-symbols-rounded">arrow_back</span>戻る</a>
            <h1>マイページ編集</h1>
            <div style="width:76px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div style="text-align: center; margin-bottom: 16px;">
            <img src="./images/profile_icon.png" alt="プロフィール" class="img-placeholder" style="width: 80px; height: 80px; border-radius: 50%;">
            <div>
                <button type="button" class="btn btn-secondary" style="display: inline-flex; width: auto; min-height: 44px; padding: 6px 16px; font-size: 15px; margin-top: 6px;">写真変更</button>
            </div>
        </div>

        <form id="mypage-edit-form" action="./mypage.html" method="get">
            <div class="form-group">
                <label for="edit-name">名前（ユーザー名）</label>
                <input type="text" id="edit-name" class="form-control" value="サンプル太郎" placeholder="お名前を入力" required>
            </div>
            <div class="form-group">
                <label for="edit-birthday">生年月日</label>
                <input type="text" id="edit-birthday" class="form-control" value="1995年9月26日" required>
            </div>
            <div class="form-group">
                <label for="edit-prefecture">住んでいる県</label>
                <input type="text" id="edit-prefecture" class="form-control" value="サンプル県" required>
            </div>
            <div class="form-group">
                <label for="edit-city">住んでいる市</label>
                <input type="text" id="edit-city" class="form-control" value="サンプル市" required>
            </div>
            <div class="form-group">
                <label for="edit-email">メールアドレス</label>
                <input type="email" id="edit-email" class="form-control" value="sample_user@example.com" required>
            </div>
            <div class="form-group">
                <label for="edit-password">パスワード</label>
                <input type="password" id="edit-password" class="form-control" value="sample_password_123" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 20px;">確定する</button>
        </form>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
