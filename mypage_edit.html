<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ編集 - カサピタ</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <a href="./mypage.html" class="btn-back">戻る</a>
            <h1>マイページ編集</h1>
            <div style="width:60px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="./images/profile_icon.png" alt="プロフィール" class="img-placeholder" style="width: 80px; height: 80px; border-radius: 50%;">
            <div>
                <button type="button" class="btn btn-secondary" style="display: inline-block; width: auto; padding: 6px 15px; font-size: 14px; margin-top: 5px;">写真変更</button>
            </div>
        </div>

        <form action="./mypage.html" method="get">
            <div class="form-group">
                <label>生年月日</label>
                <input type="text" class="form-control" value="9月26日" required>
            </div>
            <div class="form-group">
                <label>住んでいる県</label>
                <input type="text" class="form-control" value="サンプル県" required>
            </div>
            <div class="form-group">
                <label>住んでいる市</label>
                <input type="text" class="form-control" value="サンプル市" required>
            </div>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" class="form-control" value="sample_user@example.com" required>
            </div>
            <div class="form-group">
                <label>パスワード</label>
                <input type="password" class="form-control" value="sample_password_123" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 20px;">確定する</button>
        </form>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon">N</div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon">M</div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon">S</div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
