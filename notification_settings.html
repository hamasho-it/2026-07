<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知設定 - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <a href="./settings.html" class="btn-back"><span class="material-symbols-rounded">arrow_back</span>戻る</a>
            <h1>通知設定</h1>
            <div style="width:76px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div class="card">
            <div class="toggle-switch">
                <span>通知を許可</span>
                <input type="checkbox" checked>
            </div>
            <div class="toggle-switch" style="border-bottom: none;">
                <span>通知時のバイブレーション</span>
                <input type="checkbox" checked>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">音量の変更</div>
            <input type="range" min="0" max="100" value="70" style="width: 100%; margin: 12px 0;">
        </div>

        <div class="card">
            <div class="card-title">通知音</div>
            <div class="toggle-switch"><span>音源1</span><input type="radio" name="sound" checked></div>
            <div class="toggle-switch"><span>音源2</span><input type="radio" name="sound"></div>
            <div class="toggle-switch"><span>音源3</span><input type="radio" name="sound"></div>
            <div class="toggle-switch"><span>音源4</span><input type="radio" name="sound"></div>
            <div class="toggle-switch" style="border-bottom: none;"><span>音源5</span><input type="radio" name="sound"></div>
        </div>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
