<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

                </div>
                <div style="display: flex; gap: 10px;">
                    <a href="./checkin.html" class="btn" style="flex: 1; margin: 0; font-size: 14px;">持っている</a>
                    <a href="./return_map_route.html" class="btn btn-secondary" style="flex: 1; margin: 0; font-size: 14px;">持っていない</a>

            </div>

            <div style="font-size: 11px; color: #888; text-align: center;">ロック解除してアプリを開く</div>
        </main>
    </div>
