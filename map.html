<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カサピタ - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div style="width:76px;"></div>
            <h1>カサピタ</h1>
            <a href="./settings.html" class="icon-settings" aria-label="設定"><span class="material-symbols-rounded">settings</span></a>
        </header>
        
        <main class="app-content full-map-content">
            
    <div class="full-map-container">
        <div class="map-search-overlay">
            <input type="text" class="form-control" value="" placeholder="周辺の店舗・設置本数を検索">
        </div>
        <div id="leaflet-map" style="width: 100%; height: 100%; z-index: 1;"></div>
        <div class="map-info-overlay" id="map-info">
            📍 ピンをタップすると店舗情報が表示されます
        </div>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item active">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const map = L.map('leaflet-map', {
        zoomControl: false
    }).setView([35.681236, 139.767125], 15);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const shops = [
        { name: "サンプルカフェ 桜通り店", lat: 35.681236, lng: 139.767125, capacity: 10, link: "./shop_checkin.html" },
        { name: "サンプル喫茶 中央店", lat: 35.683500, lng: 139.765000, capacity: 15, link: "./shop_checkin.html" },
        { name: "サンプルベーカリー 駅前店", lat: 35.679000, lng: 139.769000, capacity: 8, link: "./shop_checkin.html" }
    ];

    shops.forEach(shop => {
        const marker = L.marker([shop.lat, shop.lng]).addTo(map);
        
        const popupContent = `
            <div style="font-size:15px; text-align:center; padding: 4px;">
                <strong style="font-size:16px; color:#489DA8;">${shop.name}</strong><br>
                <span style="color:#333; display:inline-block; margin:6px 0;">置ける本数：${shop.capacity}本</span><br>
                <a href="${shop.link}" style="display:inline-block; padding:8px 16px; margin-top:4px; background:#F4C243; color:#333; font-weight:bold; border-radius:10px; font-size:14px; text-decoration:none;">詳細を見る</a>
            </div>
        `;
        marker.bindPopup(popupContent);

        marker.on('click', () => {
            const infoEl = document.getElementById('map-info');
            if(infoEl) {
                infoEl.innerHTML = `<span style="color:#489DA8; font-weight:bold;">📍 ${shop.name}</span><br>置ける本数：${shop.capacity}本`;
            }
        });
    });
});
</script>
</body>
</html>
