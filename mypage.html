<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ設定 - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <a href="./settings.html" class="btn-back"><span class="material-symbols-rounded">arrow_back</span>戻る</a>
            <h1>マイページ設定</h1>
            <div style="width:76px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="./images/profile_icon.png" alt="プロフィール" class="img-placeholder" style="width: 90px; height: 90px; border-radius: 50%;">
            <h2 class="js-user-name" style="font-size: 20px; font-weight: bold; color: var(--color-main); margin-top: 10px;">サンプル太郎</h2>
        </div>

        <div class="card">
            <div class="card-desc" style="margin-bottom: 10px;"><strong>名前：</strong><span class="js-user-name">サンプル太郎</span></div>
            <div class="card-desc" style="margin-bottom: 10px;"><strong>生年月日：</strong><span id="mypage-birthday">1995年9月26日</span></div>
            <div class="card-desc" style="margin-bottom: 10px;"><strong>住んでいる地域：</strong><span id="mypage-region">サンプル県サンプル市</span></div>
            <div class="card-desc" style="margin-bottom: 10px;"><strong>メールアドレス：</strong><span id="mypage-email">sample_user@example.com</span></div>
            <div class="card-desc"><strong>パスワード：</strong>••••••••••••</div>
        </div>

        <a href="./mypage_edit.html" class="btn" style="margin-top: 24px;">マイページを編集</a>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
