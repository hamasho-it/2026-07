<!DOCTYPE html>
<html lang="ja">
<head>

    <title>カサピタ - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div style="width:76px;"></div>
            <h1>カサピタ</h1>
            <a href="./settings.html" class="icon-settings" aria-label="設定"><span class="material-symbols-rounded">settings</span></a>

        <main class="app-content">
            
    <div style="width: 100%;">
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">

            <div style="flex: 1;">
                <div class="card-title" style="font-size: 17px; margin-bottom: 4px;">サンプルカフェ 桜通り店</div>
                <div class="card-desc" style="font-size: 15px;">住所：サンプル町1-1</div>
                <div class="card-desc" style="font-size: 15px;">置ける本数：10本</div>
                <a href="./route_guidance.html" class="btn" style="min-height: 44px; padding: 8px; margin-top: 8px; font-size: 16px;">案内開始</a>
            </div>
        </div>

        <div class="card" style="display: flex; gap: 12px; align-items: center;">

                <div class="card-title" style="font-size: 17px; margin-bottom: 4px;">サンプル喫茶 中央店</div>

            </div>
        </div>

        <div class="card" style="display: flex; gap: 12px; align-items: center;">
            <img src="./images/shop_photo2.png" alt="写真" class="img-placeholder" style="width: 80px; height: 80px; margin: 0;">
            <div style="flex: 1;">
                <div class="card-title" style="font-size: 17px; margin-bottom: 4px;">サンプルベーカリー 駅前店</div>

                <a href="./route_guidance.html" class="btn" style="min-height: 44px; padding: 8px; margin-top: 8px; font-size: 16px;">案内開始</a>

        </main>
        
        <nav class="app-nav">
