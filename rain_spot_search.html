<!DOCTYPE html>
<html lang="ja">
<head>

    <title>カサピタ - カサピタ</title>

        <main class="app-content">
            
    <div style="width: 100%;">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">

        <div class="card" style="display: flex; gap: 10px; align-items: center;">

            <div style="flex: 1;">
                <div class="card-title" style="font-size: 14px; margin-bottom: 3px;">サンプルカフェ 桜通り店</div>
                <div class="card-desc" style="font-size: 11px;">住所：サンプル町1-1</div>
                <div class="card-desc" style="font-size: 11px;">空き本数：3本</div>
                <a href="./route_guidance.html" class="btn" style="padding: 6px; margin-top: 5px; font-size: 12px;">案内開始</a>
            </div>
        </div>

        <div class="card" style="display: flex; gap: 10px; align-items: center;">
            <img src="./images/shop_photo2.png" alt="写真" class="img-placeholder" style="width: 70px; height: 70px; margin: 0;">
            <div style="flex: 1;">
                <div class="card-title" style="font-size: 14px; margin-bottom: 3px;">サンプル喫茶 中央店</div>

                <a href="./route_guidance.html" class="btn" style="padding: 6px; margin-top: 5px; font-size: 12px;">案内開始</a>
            </div>
        </div>

        <div class="card" style="display: flex; gap: 10px; align-items: center;">
            <img src="./images/shop_photo2.png" alt="写真" class="img-placeholder" style="width: 70px; height: 70px; margin: 0;">
            <div style="flex: 1;">
                <div class="card-title" style="font-size: 14px; margin-bottom: 3px;">サンプルベーカリー 駅前店</div>
                <div class="card-desc" style="font-size: 11px;">住所：サンプル町3-3</div>
                <div class="card-desc" style="font-size: 11px;">空き本数：1本</div>
                <a href="./route_guidance.html" class="btn" style="padding: 6px; margin-top: 5px; font-size: 12px;">案内開始</a>
