<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カサピタ - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div style="width:76px;"></div>
            <h1>カサピタ</h1>
            <a href="./settings.html" class="icon-settings" aria-label="設定"><span class="material-symbols-rounded">settings</span></a>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%; text-align: center;">
        <h2 style="font-size: 18px; font-weight: bold; color: var(--color-main); margin-bottom: 14px;">チェックイン画面</h2>
        
        <div style="margin: 12px 0;">
            <img src="./images/nfc_camera.png" alt="NFC読み取りカメラ" class="img-placeholder" style="width: 100%; height: 240px;">
            <p style="font-size: 16px; color: var(--color-text-sub); margin-top: 8px;">卓上NFCタグにかざしてください</p>
        </div>

        <a href="./shop_checkin.html" class="card" style="display: block; text-decoration: none; color: inherit; margin-top: 18px; text-align: left;">
            <div class="card-title" style="font-size: 16px;"><span class="js-user-name">サンプル太郎</span>さんの傘の設置を確認しました</div>
            <div class="card-desc" style="font-weight: bold; margin-top: 4px;">サンプルカフェ 桜通り店</div>
            <div style="font-size: 15px; color: var(--color-main); font-weight: bold; margin-top: 8px;">タップして店舗詳細を開く →</div>
        </a>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item active">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
