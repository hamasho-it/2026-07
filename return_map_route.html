<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カサピタ - カサピタ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div style="width:60px;"></div>
            <h1>カサピタ</h1>
            <div style="width:60px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div class="form-group">
            <input type="text" class="form-control" value="検索バー" readonly>
        </div>
        
        <div style="position: relative;">
            <img src="./images/map_view.png" alt="滞在していた店に戻るマップルート" class="img-placeholder" style="width: 100%; height: 280px; object-fit: cover;">
            <div style="position: absolute; top: 15px; left: 15px; right: 15px; background: rgba(0,0,0,0.75); color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; text-align: center;">
                滞在していた店に戻るマップルートを表示中
            </div>
        </div>

        <div class="card" style="margin-top: 15px; display: flex; gap: 12px; align-items: center;">
            <img src="./images/shop_photo1.png" alt="写真" class="img-placeholder" style="width: 70px; height: 70px; margin: 0;">
            <div>
                <div class="card-title" style="font-size: 16px; margin-bottom: 4px;">サンプルカフェ 桜通り店</div>
                <div class="card-desc" style="font-size: 14px;">住所：サンプル県サンプル市サンプル町1-1-1</div>
                <div class="card-desc" style="font-size: 14px; font-weight: bold; color: #111;">電話番号：000-0000-0000</div>
            </div>
        </div>

        <a href="./destination_arrival.html" class="btn" style="margin-top: 15px;">目的地に到着</a>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon">N</div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon">M</div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon">S</div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
</body>
</html>
