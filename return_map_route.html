<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カサピタ - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div style="width:76px;"></div>
            <h1>カサピタ</h1>
            <div style="width:76px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div class="form-group">
            <input type="text" class="form-control" value="検索バー" readonly>
        </div>
        
        <div style="position: relative; height: 250px; border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border);">
            <div id="leaflet-return-map" style="width: 100%; height: 100%; z-index: 1;"></div>
            <div style="position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000; background: rgba(72, 157, 168, 0.92); color: #fff; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: bold; text-align: center;">
                滞在していた店に戻るマップルートを表示中
            </div>
        </div>

        <div class="card" style="margin-top: 15px; display: flex; gap: 12px; align-items: center;">
            <img src="./images/shop_photo1.png" alt="写真" class="img-placeholder" style="width: 72px; height: 72px; margin: 0; flex-shrink: 0;">
            <div>
                <div class="card-title" style="font-size: 17px; margin-bottom: 4px;">サンプルカフェ 桜通り店</div>
                <div class="card-desc" style="font-size: 15px;">住所：サンプル県サンプル市サンプル町1-1-1</div>
                <div class="card-desc" style="font-size: 15px; font-weight: bold; color: var(--color-main);">
                    電話番号：<a href="tel:000-0000-0000" style="color: var(--color-main); text-decoration: underline;">000-0000-0000</a>
                </div>
            </div>
        </div>

        <a href="./destination_arrival.html" class="btn" style="margin-top: 14px;">目的地に到着</a>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const map = L.map('leaflet-return-map', { zoomControl: false }).setView([35.681236, 139.767125], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

    const currentPos = [35.683000, 139.769000];
    const shopPos = [35.681236, 139.767125];

    L.marker(currentPos).addTo(map).bindPopup('現在地（退店通知場所）');
    L.marker(shopPos).addTo(map).bindPopup('戻り先: サンプルカフェ 桜通り店');

    const route = L.polyline([currentPos, [35.682000, 139.768000], shopPos], { color: '#D9534F', weight: 5, opacity: 0.85, dashArray: '8, 8' }).addTo(map);
    map.fitBounds(route.getBounds(), { padding: [30, 30] });
});
</script>
</body>
</html>
