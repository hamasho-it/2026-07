<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カサピタ - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div style="width:76px;"></div>
            <h1>カサピタ</h1>
            <div style="width:76px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
        <div class="card" style="background: var(--color-main); color: var(--color-text-inverse); border: none; padding: 12px; font-size: 16px; font-weight: bold; text-align: center; margin-bottom: 12px; flex-shrink: 0;">
            ルート案内中：サンプルカフェ 桜通り店へ
        </div>
        
        <div style="flex: 1; min-height: 210px; position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border);">
            <div id="leaflet-guidance-map" style="width: 100%; height: 100%; z-index: 1;"></div>
        </div>

        <div class="card" style="margin-top: 12px; margin-bottom: 4px; display: flex; gap: 12px; align-items: center; text-align: left; flex-shrink: 0;">
            <img src="./images/shop_photo1.png" alt="店舗写真" class="img-placeholder" style="width: 72px; height: 72px; margin: 0; flex-shrink: 0;">
            <div style="flex: 1; min-width: 0;">
                <div class="card-title" style="font-size: 17px; margin-bottom: 4px;">サンプルカフェ 桜通り店</div>
                <div class="card-desc" style="font-size: 15px; line-height: 1.4;">住所：サンプル県サンプル市サンプル町1-1-1</div>
                <div class="card-desc" style="font-size: 15px; font-weight: bold; color: var(--color-main); margin-top: 2px;">
                    電話番号：<a href="tel:000-0000-0000" style="color: var(--color-main); text-decoration: underline;">000-0000-0000</a>
                </div>
            </div>
        </div>

        <a href="./route_end.html" class="btn btn-secondary" style="margin-top: 10px; margin-bottom: 0; flex-shrink: 0;">案内終了</a>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const map = L.map('leaflet-guidance-map', { zoomControl: false }).setView([35.681236, 139.767125], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

    const startPos = [35.679000, 139.765000];
    const endPos = [35.681236, 139.767125];

    L.marker(startPos).addTo(map).bindPopup('現在地');
    L.marker(endPos).addTo(map).bindPopup('目的地: サンプルカフェ 桜通り店');

    const route = L.polyline([startPos, [35.680000, 139.766000], endPos], { color: '#489DA8', weight: 6, opacity: 0.9 }).addTo(map);
    map.fitBounds(route.getBounds(), { padding: [30, 30] });
});
</script>
</body>
</html>
