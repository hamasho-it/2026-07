<!DOCTYPE html>
<html lang="ja">
<head>

    <title>フォント設定 - カサピタ</title>

    <div class="app-container">

            <a href="./settings.html" class="btn-back">戻る</a>

            <div style="width:50px;"></div>

        <main class="app-content">
            
    <div style="width: 100%;">
        <div class="card">
            <div class="toggle-switch">

                <input type="checkbox">

        <div class="card">

        </div>

        <div class="card">
            <div class="card-title">フォントの種類</div>
            <a class="btn btn-secondary" style="margin: 5px 0;">あ ゴシック体</a>
            <a class="btn btn-secondary" style="margin: 5px 0;">あ 丸ゴシック体</a>
            <a class="btn btn-secondary" style="margin: 5px 0;">あ 明朝体</a>
        </div>
        
        <a href="./settings.html" class="btn btn-secondary">戻る</a>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon">N</div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
