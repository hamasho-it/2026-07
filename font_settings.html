<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォント設定 - カサピタ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <a href="./settings.html" class="btn-back"><span class="material-symbols-rounded">arrow_back</span>戻る</a>
            <h1>フォント設定</h1>
            <div style="width:76px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div class="card">
            <div class="toggle-switch" style="border-bottom: none;">
                <span>太字</span>
                <input type="checkbox">
            </div>
        </div>

        <div class="card">
            <div class="card-title">文字サイズ</div>
            <input type="range" min="1" max="5" value="3" style="width: 100%; margin: 12px 0;">
        </div>

        <div class="card">
            <div class="card-title">フォントの種類</div>
            <button type="button" class="btn btn-secondary" style="margin: 8px 0; justify-content: flex-start; padding-left: 20px;">あ ゴシック体</button>
            <button type="button" class="btn btn-secondary" style="margin: 8px 0; justify-content: flex-start; padding-left: 20px;">あ 丸ゴシック体</button>
            <button type="button" class="btn btn-secondary" style="margin: 8px 0; justify-content: flex-start; padding-left: 20px;">あ 明朝体</button>
        </div>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">nfc</span></div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">map</span></div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon"><span class="material-symbols-rounded">umbrella</span></div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
