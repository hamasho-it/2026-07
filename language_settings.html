<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>言語設定 - カサピタ</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <a href="./settings.html" class="btn-back">戻る</a>
            <h1>言語設定</h1>
            <div style="width:60px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div class="card">
            <div class="card-title" style="margin-bottom: 12px;">すべての言語</div>
            <div class="toggle-switch">
                <span>日本語 (日本)</span>
                <input type="radio" name="lang" checked>
            </div>
            <div class="toggle-switch">
                <span>English (United States)</span>
                <input type="radio" name="lang">
            </div>
            <div class="toggle-switch">
                <span>Français (France)</span>
                <input type="radio" name="lang">
            </div>
            <div class="toggle-switch">
                <span>簡体中文</span>
                <input type="radio" name="lang">
            </div>
            <div class="toggle-switch">
                <span>繁體中文</span>
                <input type="radio" name="lang">
            </div>
            <div class="toggle-switch">
                <span>한국語</span>
                <input type="radio" name="lang">
            </div>
        </div>
    </div>
    
        </main>
        
        <nav class="app-nav">
            
            <a href="./checkin.html" class="nav-item ">
                <div class="nav-icon">N</div>
                <span>チェックイン</span>
            </a>
            
            <a href="./map.html" class="nav-item ">
                <div class="nav-icon">M</div>
                <span>マップ</span>
            </a>
            
            <a href="./rain_spot_search.html" class="nav-item ">
                <div class="nav-icon">S</div>
                <span>安心スポット</span>
            </a>
            
        </nav>
        
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
