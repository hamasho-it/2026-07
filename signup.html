<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - カサピタ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <a href="./index.html" class="btn-back">戻る</a>
            <h1>新規登録</h1>
            <div style="width:50px;"></div>
        </header>
        
        <main class="app-content">
            
    <div style="width: 100%;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="./images/profile_icon.png" alt="プロフィール" class="img-placeholder" style="width: 90px; height: 90px; border-radius: 50%;">
        </div>
        <form action="./map.html" method="get">
            <div class="form-group">
                <label>ユーザー名</label>
                <input type="text" class="form-control" value="サンプル太郎" required>
            </div>
            <div class="form-group">
                <label>生年月日</label>
                <input type="text" class="form-control" value="1995年9月26日" required>
            </div>
            <div class="form-group">
                <label>住んでいる地域</label>
                <input type="text" class="form-control" value="サンプル県サンプル市" required>
            </div>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" class="form-control" value="sample_user@example.com" required>
            </div>
            <div class="form-group">
                <label>パスワード</label>
                <input type="password" class="form-control" value="sample_password_123" required>
            </div>
            <a href="./map.html" class="btn" style="margin-top: 25px;">登録作成</a>
            <a href="./index.html" class="btn btn-secondary">戻る</a>
        </form>
    </div>
    
        </main>
        
    </div>
    <script src="./script.js"></script>
</body>
</html>
